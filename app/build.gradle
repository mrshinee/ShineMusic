plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Spotify keys live in <project root>/secrets.properties (git-ignored)
def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.exists()) secretsFile.withInputStream { secrets.load(it) }

// Release signing: <project root>/keystore.properties + shinemusic.jks (git-ignored).
// If the file is missing, release falls back to the debug key so the APK is still installable.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.shinemusic'
    compileSdk 36

    defaultConfig {
        applicationId "com.shinemusic"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.5"
        // JioSaavn-style API base URL (no trailing slash)
        buildConfigField "String", "API_BASE", "\"https://savanapi-eta.vercel.app\""
        // Comma-separated backup servers, tried in order if the main one fails or returns nothing
        buildConfigField "String", "API_FALLBACKS", "\"https://saavn.dev\""
        // Link to your version.json (see README "Updates"). Empty = update check off.
        buildConfigField "String", "UPDATE_URL", "\"${secrets.getProperty('UPDATE_URL', '')}\""
        // GitHub "owner/repo" whose Releases are checked for app updates (see RELEASING.md)
        buildConfigField "String", "UPDATE_REPO", "\"${secrets.getProperty('UPDATE_REPO', '')}\""
        buildConfigField "String", "SPOTIFY_CLIENT_ID", "\"${secrets.getProperty('SPOTIFY_CLIENT_ID', '')}\""
        buildConfigField "String", "SPOTIFY_CLIENT_SECRET", "\"${secrets.getProperty('SPOTIFY_CLIENT_SECRET', '')}\""
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
